site_name: nOS Documentation
site_url: https://nos.nithron.com/docs/
site_description: Documentation for nOS, a NAS operating system on Debian
site_author: Nithron
copyright: >-
  nOS is source-available under the Nithron Community License v1.0.
  <a href="https://github.com/Nithron/nOS">Source on GitHub</a>,
  <a href="https://discord.gg/qzB37WS5AT">community forum on Discord</a>,
  <a href="https://patreon.com/Nithron">support on Patreon</a>.

repo_url: https://github.com/Nithron/nOS
repo_name: Source on GitHub
edit_uri: edit/main/docs-site/docs/

# The font licences travel with the files; they are not pages.
exclude_docs: |
  assets/fonts/README.md

# On the Nithron identity (DESIGN-APPS.md in the nithron-site repository):
# Material's variables are mapped onto @nithron/tokens in
# assets/stylesheets/nos-docs.css, the fonts are served from this site,
# every icon is from the shared pixel set (overrides/.icons/nithron), and the
# family bar stands above the header (overrides/main.html). The theme
# follows the system.
theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  icon:
    logo: nithron/menu
    menu: nithron/menu
    search: nithron/search
    close: nithron/close
    repo: nithron/external-link
    edit: nithron/edit
    view: nithron/eye
    top: nithron/up
    previous: nithron/chevron-left
    next: nithron/chevron-right
    admonition:
      note: nithron/notice
      abstract: nithron/notice
      info: nithron/notice
      tip: nithron/notice
      success: nithron/ok
      question: nithron/help
      warning: nithron/warning
      failure: nithron/failed
      danger: nithron/failed
      bug: nithron/failed
      example: nithron/notice
      quote: nithron/notice
  
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    
  # One palette: the tokens follow the system's light or dark theme.
  palette:
    scheme: default

extra_css:
  - assets/stylesheets/nithron-tokens.css
  - assets/stylesheets/nos-docs.css

plugins:
  - search:
      separator: '[\s\-\.]+'
      lang:
        - en

extra:
  version: v0.9.5-pre-alpha

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets

nav:
  - Home: index.md
