UI menu.c32
PROMPT 0
TIMEOUT 50
MENU TITLE nOS
MENU RESOLUTION 1024 768
MENU COLOR screen      37;40      #80ffffff #00000000 std
MENU BACKGROUND splash.png

DEFAULT live

LABEL live
  MENU LABEL ^nOS Live (amd64)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components quiet splash console=tty0 console=ttyS0,115200

LABEL install_text
  MENU LABEL ^Install nOS
  KERNEL /install/vmlinuz
  APPEND initrd=/install/initrd.gz DEBIAN_FRONTEND=text auto=true priority=high vga=normal fb=false nomodeset console=tty0 ---

LABEL install_safe
  MENU LABEL Install nOS (Safe graphics)
  KERNEL /install/vmlinuz
  APPEND initrd=/install/initrd.gz DEBIAN_FRONTEND=text auto=true priority=high nomodeset fb=false vga=normal ---

LABEL install_serial
  MENU LABEL Install nOS (Serial console @ttyS0)
  KERNEL /install/vmlinuz
  APPEND initrd=/install/initrd.gz DEBIAN_FRONTEND=text auto=true priority=high console=tty0 console=ttyS0,115200n8 fb=false nomodeset ---

LABEL kernel-fallback
  MENU LABEL Kernel fallback (no ACPI — NOT for Hyper-V)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components noapic nolapic acpi=off console=tty0 console=ttyS0,115200

MENU SEPARATOR
LABEL help
  MENU LABEL Utilities...
  COM32 hdt.c32

