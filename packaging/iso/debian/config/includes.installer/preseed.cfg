#### NithronOS installer preseed
#
# This file is embedded in live-build's installer initrd (/install/initrd.gz)
# and loaded automatically. The boot menu starts the installer with
# "auto=true priority=high": everything preseeded here is answered silently,
# and the installer only asks the questions a person must answer:
#   - the console administrator's password,
#   - which disk to install to (when the machine has more than one),
#   - confirmation before that disk is erased.
#
# live-installer copies the live system (which already contains the NithronOS
# packages) to the disk, so no packages are downloaded during the install.

### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string nithronos
d-i netcfg/get_domain string local
d-i netcfg/hostname string nithronos
# Continue without network (static setup can be done later in the web UI).
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_options select Do not configure the network at this time

### Package sources
# Nothing is downloaded during the install. The installed system's APT
# sources (Debian, security, updates, Docker) are written by late-command.sh.
d-i apt-setup/use_mirror boolean false
d-i apt-setup/no_mirror boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/services-select multiselect
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Accounts
# No root password: the console administrator uses sudo. "admin" is a
# reserved name in Debian, so the account is "nosadmin". The password is
# asked during the install (it is not preseeded on purpose).
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string NithronOS console administrator
d-i passwd/username string nosadmin
d-i passwd/user-uid string 1000
d-i user-setup/allow-password-weak boolean false
d-i user-setup/encrypt-home boolean false

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

### Partitioning
# The disk is NOT preseeded: on a NAS with several drives the installer must
# ask which one to erase. GPT everywhere, with a BIOS boot partition and an
# EFI system partition so the same layout boots on BIOS and UEFI machines.
d-i partman-auto/method string regular
d-i partman-basicfilesystems/choose_label string gpt
d-i partman-basicfilesystems/default_label string gpt
d-i partman-partitioning/choose_label string gpt
d-i partman-partitioning/default_label string gpt
d-i partman/choose_label string gpt
d-i partman/default_label string gpt
d-i partman-auto/choose_recipe select nithronos
d-i partman-auto/expert_recipe string                         \
      nithronos ::                                            \
              1 1 1 free                                      \
                      $bios_boot{ }                           \
                      method{ biosgrub }                      \
              .                                               \
              512 512 512 fat32                               \
                      $iflabel{ gpt }                         \
                      $reusemethod{ }                         \
                      method{ efi }                           \
                      format{ }                               \
              .                                               \
              2048 2048 4096 linux-swap                       \
                      method{ swap }                          \
                      format{ }                               \
              .                                               \
              8192 10000 -1 btrfs                             \
                      method{ format }                        \
                      format{ }                               \
                      use_filesystem{ }                       \
                      filesystem{ btrfs }                     \
                      mountpoint{ / }                         \
                      options/noatime{ noatime }              \
                      options/compress{ compress=zstd:3 }     \
              .
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm_nooverwrite boolean true
# partman/confirm is left unanswered so the installer shows which disk it is
# about to erase and waits for a "yes".

### Base system
d-i base-installer/install-recommends boolean true
d-i base-installer/kernel/image string linux-image-amd64

### Software
# Everything is already in the copied live system.
tasksel tasksel/first multiselect
d-i pkgsel/include string
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true

### Finish
# Checks that the NithronOS services are on the target and enables them; a
# failure stops the install with an error instead of producing a system
# without nosd.
d-i preseed/late_command string sh /usr/lib/nithronos-installer/late-command.sh
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
