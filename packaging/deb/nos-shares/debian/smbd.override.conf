# nOS override for smbd.service
[Service]
# Ensure proper restart on failure
Restart=on-failure
RestartSec=5s

# Create runtime directories
RuntimeDirectory=samba
RuntimeDirectoryMode=0755
StateDirectory=samba
StateDirectoryMode=0755

# Security hardening
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=no
# Shares live in /srv/shares and on pools under /mnt ("-": skip if missing).
ReadWritePaths=-/srv/shares -/mnt /var/lib/samba /var/cache/samba /run/samba -/var/log/samba

# Ensure service starts after network
[Unit]
After=network-online.target
Wants=network-online.target
