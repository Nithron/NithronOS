d /etc/nos 0770 nos nos -
d /var/lib/nos 0770 nos nos -
d /var/lib/nos/state 0770 nos nos -
Z /etc/nos - nos nos -
Z /var/lib/nos - nos nos -
# First-boot setup code banner: nosd writes /run/nos/firstboot.issue and
# agetty shows it above the login prompt. Dangling until nosd writes it.
d /etc/issue.d 0755 root root -
L+ /etc/issue.d/50-nithronos-setup.issue - - - - /run/nos/firstboot.issue
