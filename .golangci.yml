version: "2"

linters:
  default: standard
  settings:
    staticcheck:
      checks:
        - all
        # Defaults from golangci-lint (style checks we don't enforce):
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # "Could apply De Morgan's law": the un-negated form is often clearer.
        - -QF1001
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    generated: lax

formatters:
  enable:
    - gofmt
